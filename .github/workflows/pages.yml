name: Pages

# Publishes the browser version: the page from web/ with the montecarlo_pi package next to it.
on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'montecarlo_pi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/montecarlo_pi
          cp web/* _site/
          cp montecarlo_pi/__init__.py montecarlo_pi/estimate.py montecarlo_pi/simulation.py _site/montecarlo_pi/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
